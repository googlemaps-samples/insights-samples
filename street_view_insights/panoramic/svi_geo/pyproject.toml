[build-system]
requires = ["setuptools>=68,<85", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "svi-geo"
version = "0.1.0"
description = "Geometry, sequencing, dedup and Gemini helpers for Street View Insights panoramic (rosette) imagery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  # Lower bound: the versions the notebooks and tests were verified with; upper bound: the
  # next major release. requirements.lock pins the exact, hash-checked set.
  "numpy>=2.5,<3",
  "scipy>=1.18,<2",
  "opencv-python-headless>=5.0,<6",
  "scikit-learn>=1.9,<2",
  "shapely>=2.1,<3",
  "pydantic>=2.13,<3",
  "google-genai>=2.25,<3",
  "google-cloud-bigquery>=3.45,<4",
  "google-cloud-storage>=3.14,<4",
  "db-dtypes>=1.7,<2",
  "pandas>=3.0,<4",
  "pyarrow>=25.0,<26",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.4,<2", "ruff==0.16.9"]
notebooks = ["folium>=0.20,<1", "matplotlib>=3.11,<4", "nbformat>=5.11,<6", "nbconvert>=7.17,<8"]

[tool.setuptools]
packages = ["svi_geo"]

[tool.setuptools.package-data]
svi_geo = ["intrinsics/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
