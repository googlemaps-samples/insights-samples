[build-system]
requires = ["setuptools>=68,<85", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "svi-geo"
version = "0.1.0"
description = "Geometry, sequencing, dedup and Gemini helpers for Street View Insights panoramic (rosette) imagery."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  # Lower bound: the versions preinstalled on Colab (runtime 2026.07 and current, see
  # constraints/), so installing svi_geo on Colab upgrades nothing; upper bound: the
  # next major release. requirements.lock pins the exact, hash-checked local set.
  "numpy>=2.0.2,<3",
  "scipy>=1.14,<2",
  "opencv-python-headless>=4.10,<6",
  "scikit-learn>=1.6,<2",
  "shapely>=2.1,<3",
  "pydantic>=2.13,<3",
  "google-genai>=2.11,<3",
  "google-cloud-bigquery>=3.42,<4",
  "google-cloud-storage>=3.13,<4",
  "db-dtypes>=1.7,<2",
  "pandas>=2.2.2,<4",
  "pyarrow>=18.1,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff==0.16.9",
  "uv>=0.12,<1",  # provisions Python 3.12 for tests/test_colab_compat.py (slow)
]
notebooks = [
  "folium>=0.20,<1",
  "matplotlib>=3.10,<4",
  "nbformat>=5.10.4,<6",
  "nbconvert>=7.17,<8",
]

[tool.setuptools]
packages = ["svi_geo"]

[tool.setuptools.package-data]
svi_geo = ["intrinsics/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
