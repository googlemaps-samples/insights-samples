[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svi-lidar"
version = "0.1.0"
description = "3D LiDAR (.laz) spatial utilities and multimodal skills for Full-Frame and Panoramic Street View Insights"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "laspy[lazrs]>=2.5,<3",
    "opencv-python-headless>=4.8,<5",
    "Pillow>=10.0,<12",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-bigquery>=3.20,<4",
    "google-cloud-storage>=2.14,<4",
    "google-genai>=1.0,<3",
]
dev = [
    "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["svi_lidar*"]
